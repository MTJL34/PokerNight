<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stats Joueur</title>
  <link rel="icon" type="image/png" href="./img/Poker.png" />
  <link rel="stylesheet" href="./css/player-stats.css" />
</head>
<body>
  <main class="container">
    <section class="panel">
      <div class="panel__head">
        <h1>Stats joueur</h1>
        <div class="panel__actions">
          <a class="btn btnLink" href="./home.html">Accueil</a>
          <button id="refreshBtn" class="btn" type="button">Rafraîchir</button>
        </div>
      </div>

      <div class="panel__body">
        <div>
          <span class="pickerLabel">Choisir un joueur</span>
          <div id="playerButtons" class="playerButtons"></div>
        </div>
        <p id="statusMsg" class="status"></p>
      </div>
    </section>

    <section class="cards" id="statsCards"></section>

    <section class="panel">
      <div class="panel__head">
        <h2>Détail des sessions</h2>
      </div>
      <div class="tableWrap">
        <table id="sessionsTable" aria-label="Détail des sessions joueur">
          <thead>
            <tr>
              <th>Session</th>
              <th>Position</th>
              <th>Mise</th>
              <th>Gain</th>
              <th>Net</th>
              <th>Net cumulé</th>
            </tr>
          </thead>
          <tbody id="sessionsBody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="module" src="./scripts/player-stats.js?v=20260320-1"></script>
</body>
</html>
