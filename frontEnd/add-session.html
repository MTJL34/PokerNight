<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ajouter Une Session</title>
  <link rel="icon" type="image/png" href="./img/Poker.png" />
  <link rel="stylesheet" href="./css/home.css" />
</head>
<body class="addSessionMode">
  <main class="container">
    <section class="panel">
      <div class="panel__head">
        <h2>Ajouter une session</h2>
        <a class="btn btnLink sessionBackBtn" href="./home.html">Retour</a>
      </div>
      <div class="sessionEditor">
        <form id="sessionForm" class="controls sessionForm">
          <input id="sessionId" type="hidden" />

          <div class="sessionForm__base">
            <label class="field sessionField">
              <span>Nom session</span>
              <input id="sessionName" type="text" required placeholder="Ex: Poker 9" />
            </label>

            <label class="field sessionField sessionField--stack">
              <span>10 € = stack</span>
              <input id="stackPer10Input" type="number" min="1" step="1" placeholder="10000" />
            </label>
          </div>

          <div class="sessionForm__chips">
            <label class="field chipField chipField--orange">
              <span>Valeur jeton orange</span>
              <input id="chipValueOrangeInput" type="number" min="1" step="1" placeholder="50" />
            </label>
            <label class="field chipField chipField--black">
              <span>Valeur jeton noir</span>
              <input id="chipValueBlackInput" type="number" min="1" step="1" placeholder="100" />
            </label>
            <label class="field chipField chipField--green">
              <span>Valeur jeton vert</span>
              <input id="chipValueGreenInput" type="number" min="1" step="1" placeholder="500" />
            </label>
            <label class="field chipField chipField--yellow">
              <span>Valeur jeton jaune</span>
              <input id="chipValueYellowInput" type="number" min="1" step="1" placeholder="1000" />
            </label>
            <label class="field chipField chipField--red">
              <span>Valeur jeton rouge</span>
              <input id="chipValueRedInput" type="number" min="1" step="1" placeholder="5000" />
            </label>
            <label class="field chipField chipField--white">
              <span>Valeur jeton blanc</span>
              <input id="chipValueWhiteInput" type="number" min="1" step="1" placeholder="10000" />
            </label>
          </div>

          <div class="sessionForm__meta">
            <label class="field sessionField">
              <span>Statut session</span>
              <select id="sessionStatusInput">
                <option value="open" selected>Ouverte</option>
                <option value="closed">Fermee</option>
              </select>
            </label>
            <label class="field sessionField">
              <span>Nombre de participants</span>
              <input id="participantCount" type="number" min="1" step="1" value="8" />
            </label>
            <button id="applyCountBtn" class="btn" type="button">Valider</button>
          </div>
        </form>

        <div class="panel sessionParticipants">
          <div class="panel__head">
            <h2>Participants</h2>
            <div class="sessionHeadActions">
              <button id="openNewParticipantBtn" class="btn" type="button">Nouveau participant</button>
              <button id="addRowBtn" class="btn" type="button">Ajouter une ligne</button>
            </div>
          </div>
          <div class="tableWrap">
            <table id="participantsTable">
              <thead>
                <tr>
                  <th>Joueur existant</th>
                  <th>Position</th>
                  <th>Mise (€)</th>
                  <th>Elimine</th>
                  <th>Gain (auto)</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="sessionTotalsInfo" class="muted sessionTotalsInfo">
            Argent total en jeu: 0 € | Stacks complets: 0 | Total gains: 0 €
          </div>
        </div>

        <div class="sessionBottomActions">
          <button id="openGainsModalBtn" class="btn" type="button">Repartir les gains</button>
          <button id="saveBtn" class="btn" type="button">Enregistrer la session</button>
        </div>
      </div>
    </section>
  </main>

  <div id="newParticipantModal" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;">
    <div class="panel" style="width:min(560px,92vw);">
      <div class="panel__head">
        <h2>Nouveau participant</h2>
      </div>
      <div style="padding:14px;display:flex;flex-direction:column;gap:10px;">
        <label class="field">
          <span>Nom du participant</span>
          <input id="newParticipantInput" type="text" placeholder="Ex: Alex" />
        </label>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button id="cancelNewParticipantBtn" class="btn" type="button">Annuler</button>
          <button id="confirmNewParticipantBtn" class="btn" type="button">Ajouter</button>
        </div>
      </div>
    </div>
  </div>

  <div id="gainsModal" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;">
    <div class="panel" style="width:min(560px,92vw);">
      <div class="panel__head">
        <h2>Répartition des gains</h2>
      </div>
      <div style="padding:14px;display:flex;flex-direction:column;gap:10px;">
        <div id="gainsPoolInfo" class="muted">Il y a 0 €</div>
        <div id="gainsDistributedInfo" class="muted">Total gains partages: 0 €</div>
        <label class="field">
          <span>Gain 1er</span>
          <select id="gainFirstInput"></select>
        </label>
        <label class="field">
          <span>Gain 2e</span>
          <select id="gainSecondInput"></select>
        </label>
        <label class="field">
          <span>Gain 3e</span>
          <select id="gainThirdInput"></select>
        </label>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button id="cancelGainsModalBtn" class="btn" type="button">Annuler</button>
          <button id="confirmGainsModalBtn" class="btn" type="button">Valider</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./scripts/add-session.js?v=20260320-5"></script>
</body>
</html>
